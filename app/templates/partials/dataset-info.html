<label class="form-control w-full max-w-xs">
  <div class="label">
      <span class="label-text">Select a dataset</span>
      <span class="label-text-alt">Stored datasets</span>
  </div>
  <!-- Dropdown to select existing datasets -->
  <select id="existing-dataset-select"
          class="select select-bordered w-full max-w-xs">
      <option disabled selected>Choose a dataset</option>
      {% for dataset in datasets %}<option value="{{ dataset }}">{{ dataset }}</option>{% endfor %}
  </select>
  <div class="divider">OR</div>
  <div class="label">
      <span class="label-text">Upload your dataset</span>
      <span class="label-text-alt">Supported: <strong>.csv</strong></span>
  </div>
  <input id="dataset-input"
         name="dataset-file"
         type="file"
         accept=".csv"
         class="file-input file-input-xs file-input-bordered w-full max-w-xs" />
  <div class="label"></div>
</label>

<div id="csv-info">
  <h4 class="text-md font-semibold text-gray-700 mb-1">Dataset file</h4>
  
  <div class="grid grid-cols-2 mb-2">
    <div class="col">
      <p id="csv-filename" class="text-sm text-gray-600">File</p>
      <p id="csv-size" class="text-sm text-gray-600">Size: 0 KB</p>
    </div>
    <div class="col">
      <p id="csv-rows" class="text-sm text-gray-600">Rows: 0</p>
      <p id="csv-columns-count" class="text-sm text-gray-600">Columns: 0</p>
    </div>
  </div>

  <h4 class="text-md font-semibold text-gray-700 mb-1">Data specification</h4>

  <div class="overflow-x-auto">
    <table id="dataset-spec-table" class="table table-xs">
      <thead>
        <tr>
          <th>Column</th>
          <th>Data type</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows are populated automaticaly  -->
      </tbody>
    </table>
  </div>
  <!-- add small button for previewing the data as modal -->
    

</div>
